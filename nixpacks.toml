[phases.setup]
nixPkgs = ["php84", "php84Extensions.curl", "php84Extensions.mbstring", "php84Extensions.fileinfo", "php84Extensions.tokenizer", "php84Extensions.xml", "php84Extensions.pdo", "nodejs_20"]

[phases.install]
cmds = [
  "composer install --optimize-autoloader --no-scripts --no-interaction",
  "npm install",
  "npm run build"
]

[phases.build]
cmds = [
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
